  <!-- /iconos-delulu -->
  <main id="app"></main>

  <!-- Editor de páginas: sus ids son los del código original de Delulu Journal V2. -->
  <section id="open" aria-label="Editor de páginas">
    <aside class="side" id="lib"></aside>
    <div class="stage-col">
      <div class="stagebar">
        <button class="btn ghost icon" id="btnBack" aria-label="Volver al cuaderno"><svg class="i"><use href="#i-back"/></svg></button>
        <div class="title" id="openTitle"></div>
        <div class="spacer"></div>
        <button class="btn ghost icon" id="btnUndo" aria-label="Deshacer"><svg class="i"><use href="#i-undo"/></svg></button>
        <button class="btn ghost icon" id="btnRedo" aria-label="Rehacer"><svg class="i"><use href="#i-redo"/></svg></button>
        <button class="btn ghost icon dt" id="btnDraw" aria-label="Dibujo libre"><svg class="i"><use href="#i-pen"/></svg></button>
        <button class="btn ghost icon dt" id="btnSnap" aria-label="Guías de alineación" title="Guías de alineación"><svg class="i"><use href="#i-magnet"/></svg></button>
        <button class="btn ghost icon hide-sm" id="btnView" aria-label="Una o dos páginas"><svg class="i"><use href="#i-spread"/></svg></button>
        <button class="btn ghost icon hide-sm" id="btnZoomOut" aria-label="Alejar"><svg class="i"><use href="#i-minus"/></svg></button>
        <button class="btn ghost icon hide-sm" id="btnZoomIn" aria-label="Acercar"><svg class="i"><use href="#i-plus"/></svg></button>
        <button class="btn ghost dt" id="btnCoverFromOpen"><svg class="i"><use href="#i-book"/></svg><span class="hide-sm">Portada</span></button>
        <button class="btn primary dt" id="btnLibMobile" hidden><svg class="i"><use href="#i-plus"/></svg>Agregar</button>
      </div>
      <div class="stage" id="stage"></div>
      <div class="stagebar" style="padding-top:0">
        <button class="btn ghost icon" id="btnPrev" aria-label="Página anterior"><svg class="i"><use href="#i-left"/></svg></button>
        <span class="hint" id="pageInfo"></span>
        <button class="btn ghost icon" id="btnNext" aria-label="Página siguiente"><svg class="i"><use href="#i-right"/></svg></button>
        <div class="spacer"></div>
        <button class="btn ghost dt" id="btnPageMenu"><svg class="i"><use href="#i-pages"/></svg>Páginas</button>
      </div>
      <div class="thumbs" id="thumbs" hidden></div>
      <nav class="dock mobile-only" aria-label="Herramientas">
        <button type="button" class="on" data-click="#btnLibMobile"><svg class="i"><use href="#i-plus"/></svg>Agregar</button>
        <button type="button" data-click="#btnDraw"><svg class="i"><use href="#i-pen"/></svg>Dibujar</button>
        <button type="button" data-click="#btnPageMenu"><svg class="i"><use href="#i-pages"/></svg>Páginas</button>
        <button type="button" data-click="#btnCoverFromOpen"><svg class="i"><use href="#i-book"/></svg>Portada</button>
      </nav>
      <div id="ctx"></div>
    </div>
    <!-- Partes del original que Hojea no usa, pero su código espera encontrar. -->
    <div hidden>
      <div id="cover"></div><div id="share"></div><div id="shareStage"></div><div id="cctx"></div>
      <button id="cUndo"></button><button id="cRedo"></button><button id="cSnap"></button>
    </div>
  </section>
  <noscript>Hojea necesita JavaScript para funcionar.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
